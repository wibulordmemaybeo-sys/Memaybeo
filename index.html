<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push-up Solo Boss Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
    h1 {
      margin-bottom: 12px;
      font-size: 24px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .game-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background-color: #000;
    }
    #webcam { display: none; }
    #gameCanvas {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #1d4ed8; transform: translateY(-2px); }
    button:disabled { background: #475569; cursor: not-allowed; transform: none; }
    #recBtn { background: #dc2626; }
    #recBtn:hover { background: #b91c1c; }
  </style>

  <!-- Thu viện MediaPipe Pose & Camera Utils từ CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>⚔️ Chống Đẩy Solo Boss ⚔️</h1>

  <div class="game-container">
    <video id="webcam" playsinline></video>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <div class="controls">
    <button id="startCamBtn" onclick="startCamera()">📷 Bật Camera</button>
    <button id="recBtn" onclick="toggleRecord()" disabled>📹 Quay Video Solo</button>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('gameCanvas');
    const ctx = canvasElement.getContext('2d');
    const recBtn = document.getElementById('recBtn');

    // Quản lý trạng thái Game
    let reps = 0;
    let stage = 'UP'; // 'UP' hoặc 'DOWN'
    let floatingTexts = [];
    
    const bosses = [
      { name: "GOBLIN CHÚA", maxHp: 100, hp: 100, color: "#22c55e", icon: "👹", dmgPerRep: 25 },
      { name: "ORC CHIẾN BINH", maxHp: 200, hp: 200, color: "#ea580c", icon: "👾", dmgPerRep: 25 },
      { name: "CHÚA TỂ QUỶ", maxHp: 300, hp: 300, color: "#dc2626", icon: "👿", dmgPerRep: 30 }
    ];
    let currentBossIndex = 0;

    // Quản lý Ghi Video (MediaRecorder)
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    // Tính góc giữa 3 điểm mốc (Vai - Khuỷu tay - Cổ tay)
    function calculateAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360.0 - angle;
      return angle;
    }

    function addFloatingText(text, x, y, color = '#ef4444') {
      floatingTexts.push({ text, x, y, opacity: 1.0, color });
    }

    function dealDamage() {
      const currentBoss = bosses[currentBossIndex];
      if (!currentBoss || currentBoss.hp <= 0) return;

      currentBoss.hp = Math.max(0, currentBoss.hp - currentBoss.dmgPerRep);
      addFloatingText(`-${currentBoss.dmgPerRep} HP`, canvasElement.width - 180, 150, '#ff4444');

      if (currentBoss.hp === 0) {
        addFloatingText("KNOCKOUT!", canvasElement.width / 2 - 60, canvasElement.height / 2, '#eab308');
        setTimeout(() => {
          if (currentBossIndex < bosses.length - 1) {
            currentBossIndex++;
          }
        }, 1200);
      }
    }

    function drawUI(leftAngle, rightAngle) {
      const width = canvasElement.width;
      const currentBoss = bosses[currentBossIndex];

      // 1. Thanh Solo Top Bar
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(0, 0, width, 110);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 110);
      ctx.lineTo(width, 110);
      ctx.stroke();

      // Thông tin Người chơi (Bên trái)
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('HERO (BẠN)', 20, 30);
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`Reps: ${reps}`, 20, 60);

      const displayAngle = Math.round(leftAngle || rightAngle || 0);
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = stage === 'DOWN' ? '#ef4444' : '#22c55e';
      ctx.fillText(`Góc tay: ${displayAngle}° [${stage}]`, 20, 85);

      // Nhãn VS (Chính giữa)
      ctx.fillStyle = '#eab308';
      ctx.font = '900 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('VS', width / 2, 45);
      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`MAN ẢI ${currentBossIndex + 1}/${bosses.length}`, width / 2, 75);
      ctx.textAlign = 'left';

      // Thông tin Boss (Bên phải)
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(`${currentBoss.icon} ${currentBoss.name}`, width - 20, 30);

      // Thanh Máu Boss
      const barWidth = 220;
      const barHeight = 20;
      const barX = width - 20 - barWidth;
      const barY = 40;

      ctx.fillStyle = '#334155';
      ctx.fillRect(barX, barY, barWidth, barHeight);

      const hpRatio = currentBoss.hp / currentBoss.maxHp;
      ctx.fillStyle = currentBoss.color;
      ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barWidth, barHeight);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`${currentBoss.hp} / ${currentBoss.maxHp} HP`, width - 25, barY + 15);
      ctx.textAlign = 'left';

      // 2. Hiệu ứng Số Sát Thương Bay Lên
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ctx.save();
        ctx.globalAlpha = ft.opacity;
        ctx.fillStyle = ft.color;
        ctx.font = '900 26px sans-serif';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();

        ft.y -= 1.5;
        ft.opacity -= 0.02;
        if (ft.opacity <= 0) floatingTexts.splice(i, 1);
      }
    }

    // Xử lý khung hình trả về từ AI MediaPipe Pose
    function onResults(results) {
      // Vẽ luồng Webcam lật gương (Mirror view)
      ctx.save();
      ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      ctx.translate(canvasElement.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      ctx.restore();

      let leftAngle = 0, rightAngle = 0;

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;

        // Tính góc khuỷu tay Trái (11: Vai, 13: Khuỷu, 15: Cổ tay)
        if (lm[11] && lm[13] && lm[15]) {
          leftAngle = calculateAngle(
            { x: lm[11].x * canvasElement.width, y: lm[11].y * canvasElement.height },
            { x: lm[13].x * canvasElement.width, y: lm[13].y * canvasElement.height },
            { x: lm[15].x * canvasElement.width, y: lm[15].y * canvasElement.height }
          );
        }

        // Logic đếm Push-up & Gây sát thương
        const currentAngle = leftAngle || 180;
        if (currentAngle < 90) {
          stage = 'DOWN';
        }
        if (currentAngle > 160 && stage === 'DOWN') {
          stage = 'UP';
          reps++;
          dealDamage();
        }
      }

      // Vẽ Giao diện Solo đè lên video
      drawUI(leftAngle, rightAngle);
    }

    // Khởi tạo MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    function startCamera() {
      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        width: 800,
        height: 600
      });
      camera.start();
      document.getElementById('startCamBtn').disabled = true;
      recBtn.disabled = false;
    }

    // Xử lý Quay Video trực tiếp từ Canvas
    function toggleRecord() {
      if (!isRecording) {
        recordedChunks = [];
        const stream = canvasElement.captureStream(30); // 30 FPS
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `solo-pushup-${Date.now()}.webm`;
          a.click();
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.innerText = '⏹️ Dừng & Tải Video';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = '📹 Quay Video Solo';
      }
    }
  </script>
</body>
    </html>
